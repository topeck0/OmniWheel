name: Build OmniWheel

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload artifacts to release v0.9'
        type: boolean
        default: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: android-actions/setup-android@v3
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
      
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease
      
      - uses: actions/upload-artifact@v4
        with:
          name: OmniWheel-android
          path: android/app/build/outputs/apk/release/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Build EXE
        run: |
          cd windows/src/OmniWheelPC
          dotnet publish -c Release -p:EnableWindowsTargeting=true
      
      - uses: actions/upload-artifact@v4
        with:
          name: OmniWheel-windows
          path: windows/src/OmniWheelPC/bin/Release/net8.0-windows/win-x64/publish/OmniWheelPC.exe

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9' }}
          files: |
            OmniWheel-android/app-release.apk
            OmniWheel-windows/OmniWheelPC.exe
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          update_prerelease: true
          make_latest: false
          overwrite: true
